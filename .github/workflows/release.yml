name: Publish npm release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: orbit-npm-release
  cancel-in-progress: false

jobs:
  native-windows-helper:
    name: Compile Windows AppContainer helper
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Configure the native helper
        run: >-
          cmake -S native/windows-appcontainer-helper
          -B build/windows-appcontainer-helper -A x64
      - name: Build the native helper with warnings as errors
        run: >-
          cmake --build build/windows-appcontainer-helper
          --config Release --parallel
      - name: Run native helper rejection tests
        run: >-
          ctest --test-dir build/windows-appcontainer-helper
          --build-config Release --output-on-failure
      - name: Verify the expected executable exists
        shell: pwsh
        run: |
          $binary = Join-Path $PWD "build/windows-appcontainer-helper/Release/orbit-windows-sandbox-helper.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Native helper build did not produce the expected executable."
          }
          Get-FileHash -LiteralPath $binary -Algorithm SHA256

  publish:
    name: Verify and publish @orbit-build/cli
    needs: native-windows-helper
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-production
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@11.18.0 && npm --version
      - run: pnpm install --frozen-lockfile
      - name: Match the release tag to the package version
        shell: bash
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          test "${RELEASE_TAG}" = "v${version}"
      - run: pnpm verify:release
      - name: Pack the verified artifact
        id: pack
        shell: bash
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          filename="orbit-build-cli-${version}.tgz"
          npm pack ./packages/cli --silent
          test -f "${filename}"
          sha256sum "${filename}" > "${filename}.sha256"
          echo "filename=${filename}" >> "${GITHUB_OUTPUT}"
      - name: Generate a CycloneDX release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: packages/cli
          format: cyclonedx-json
          output-file: orbit-cli-${{ env.RELEASE_TAG }}.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: orbit-cli-${{ env.RELEASE_TAG }}
          path: |
            ${{ steps.pack.outputs.filename }}
            ${{ steps.pack.outputs.filename }}.sha256
            orbit-cli-${{ env.RELEASE_TAG }}.cdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish the exact verified tarball with provenance
        run: npm publish "${{ steps.pack.outputs.filename }}" --access public --provenance
      - name: Verify the public registry artifact
        shell: bash
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          published=""
          for attempt in {1..12}; do
            published="$(npm view "@orbit-build/cli@${version}" version 2>/dev/null || true)"
            if [[ "${published}" == "${version}" ]]; then
              break
            fi
            sleep 5
          done
          test "${published}" = "${version}"
          integrity="$(npm view "@orbit-build/cli@${version}" dist.integrity)"
          test -n "${integrity}"
          install_root="$(mktemp -d)"
          npm install --prefix "${install_root}" --ignore-scripts "@orbit-build/cli@${version}"
          node "${install_root}/node_modules/@orbit-build/cli/dist/index.js" --version
