name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }} · Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - if: matrix.node == 24
        run: pnpm audit:prod
      - if: matrix.node == 24
        run: pnpm test:coverage:critical
      - if: matrix.node == 24
        name: Run real-browser Web UI smoke
        env:
          ORBIT_E2E_BROWSER_CHANNEL: chrome
        run: pnpm test:webui:e2e
      - if: matrix.node == 24
        run: pnpm smoke:cli
      - if: matrix.node == 24
        run: pnpm smoke:install
      - if: matrix.node == 24
        run: node scripts/verify-cli-package.mjs

  platform:
    name: Node 22 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - if: matrix.os == 'macos-latest'
        name: Run macOS process sandbox smoke
        run: >-
          pnpm exec vitest run
          packages/sandbox/src/ProcessSandbox.test.ts
          packages/tools/src/shell/bash.test.ts
          packages/tools/src/runtime/BackgroundTaskRuntime.test.ts
      - run: pnpm verify
      - run: pnpm smoke:cli
      - run: pnpm smoke:install
      - run: node scripts/verify-cli-package.mjs

  native-windows-helper:
    name: Windows AppContainer helper · source build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure the native helper
        run: >-
          cmake -S native/windows-appcontainer-helper
          -B build/windows-appcontainer-helper -A x64
      - name: Build the native helper with warnings as errors
        run: >-
          cmake --build build/windows-appcontainer-helper
          --config Release --parallel
      - name: Run native helper rejection tests
        run: >-
          ctest --test-dir build/windows-appcontainer-helper
          --build-config Release --output-on-failure
      - name: Verify the expected executable exists
        shell: pwsh
        run: |
          $binary = Join-Path $PWD "build/windows-appcontainer-helper/Release/orbit-windows-sandbox-helper.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Native helper build did not produce the expected executable."
          }
          Get-FileHash -LiteralPath $binary -Algorithm SHA256
