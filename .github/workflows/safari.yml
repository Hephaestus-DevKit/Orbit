name: Safari browser checks

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  browser:
    name: WebKit and system Safari
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Exercise native browser layout and takeover
        run: |
          swiftc native/orbit-browser/{OrbitBrowser,BrowserCommands,BrowserChrome}.swift \
            native/orbit-browser/tests/BrowserLayout.swift -o "$RUNNER_TEMP/orbit-browser-layout"
          "$RUNNER_TEMP/orbit-browser-layout"
      - name: Archive the verified universal browser with file modes and signature
        run: |
          codesign --verify --strict "packages/cli/dist/Orbit Browser.app"
          for arch in arm64 x86_64; do
            lipo "packages/cli/dist/Orbit Browser.app/Contents/MacOS/OrbitBrowser" -verify_arch "$arch"
          done
          tar -czf orbit-mac-browser.tar.gz -C packages/cli/dist "Orbit Browser.app"
      - name: Export the universal Orbit Browser
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: orbit-mac-browser
          path: orbit-mac-browser.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Verify the Web UI in native Safari
        run: |
          sudo safaridriver --enable
          pnpm test:webui:safari
      - name: Save system Safari workspace previews
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: system-safari-workspace
          path: native-safari-results/**/system-safari-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Run the Web UI regression suite in WebKit
        run: |
          pnpm exec playwright install webkit
          pnpm test:webui:e2e --project=webkit
